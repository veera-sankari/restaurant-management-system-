<!DOCTYPE html>
<html>
<head>

<title>Edit Table</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Edit Table</h2>

<form method="POST">

<label>Table Number</label>

<input
type="number"
name="table_number"
class="form-control"
value="{{ table.table_number }}"
required>

<br>

<label>Capacity</label>

<input
type="number"
name="capacity"
class="form-control"
value="{{ table.capacity }}"
required>

<br>

<label>Status</label>

<select
name="status"
class="form-control">

<option value="Available"
{% if table.status=="Available" %}selected{% endif %}>
Available
</option>

<option value="Occupied"
{% if table.status=="Occupied" %}selected{% endif %}>
Occupied
</option>

</select>

<br>

<button class="btn btn-primary">
Update Table
</button>

</form>

</body>
</html>
