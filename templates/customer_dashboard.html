<!DOCTYPE html>
<html>

<head>

    <title>Customer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="text-center">

        <h2>Welcome, {{ customer_name }} 👋</h2>

        <p class="text-muted">
            Explore our delicious menu
        </p>

    </div>

    <div class="card shadow mb-4">

        <img src="{{ url_for('static', filename='images/restaurant.jpg') }}"
             style="height:300px; object-fit:cover;">

    </div>

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow text-center p-3">

                <img src="{{ url_for('static', filename='images/menu.png') }}"
                     width="80"
                     class="mx-auto">

                <h4 class="mt-3">Menu</h4>

                <a href="/customer_menu"
                   class="btn btn-primary">
                   View Menu
                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center p-3">

                <img src="{{ url_for('static', filename='images/orders.png') }}"
                     width="80"
                     class="mx-auto">

                <h4 class="mt-3">Orders</h4>

                <a href="/my_orders"
   class="btn btn-success">
   My Orders
</a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow text-center p-3">

                <img src="{{ url_for('static', filename='images/revenue.png') }}"
                     width="80"
                     class="mx-auto">

                <h4 class="mt-3">Bills</h4>

                <a href="/my_bills"
   class="btn btn-warning">
   View Bills
</a>

            </div>

        </div>
        <div class="col-md-4">

    <div class="card shadow text-center p-3">

        <h4>⭐ Feedback</h4>

        <a href="/feedback"
           class="btn btn-info">
           Give Feedback
        </a>

    </div>

</div>

<a href="/logout" class="btn btn-danger">
    🚪 Logout
</a>

    </div>

</div>

</body>
</html>
