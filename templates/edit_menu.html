<!DOCTYPE html>
<html>

<head>

<title>Edit Menu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Edit Food Item</h2>

<form method="POST">

<label>Food Name</label>

<input
type="text"
name="item_name"
class="form-control"
value="{{ item.item_name }}"
required>

<br>

<label>Category</label>

<input
type="text"
name="category"
class="form-control"
value="{{ item.category }}"
required>

<br>

<label>Price</label>

<input
type="number"
name="price"
class="form-control"
value="{{ item.price }}"
required>

<br>

<label>Status</label>

<select
name="availability"
class="form-control">

<option
value="Available"
{% if item.availability=="Available" %}selected{% endif %}>
Available
</option>

<option
value="Not Available"
{% if item.availability=="Not Available" %}selected{% endif %}>
Not Available
</option>

</select>

<br>

<button class="btn btn-primary">
Update Item
</button>

</form>

</body>

</html>
