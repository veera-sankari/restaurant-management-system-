<!DOCTYPE html>
<html>

<head>

    <title>My Bills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="text-center">
        💳 My Bills
    </h1>

    <br>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>
                <th>Order ID</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for bill in bills %}

            <tr>

                <td>{{ bill.order_id }}</td>
                <td>{{ bill.item_name }}</td>
                <td>{{ bill.quantity }}</td>
                <td>₹ {{ bill.total_amount }}</td>
                <td>{{ bill.order_status }}</td>
                <td>
    {% if bill.order_status == 'Preparing' %}
        <a href="/pay_order/{{ bill.order_id }}"
           class="btn btn-success btn-sm">
           Pay Now
        </a>
    {% else %}
        Paid ✅
    {% endif %}
</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/customer_dashboard"
       class="btn btn-secondary">
       ⬅ Back
    </a>

</div>

</body>

</html>
