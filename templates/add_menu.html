<!DOCTYPE html>
<html>
<head>

<title>Add Menu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Add Food Item</h2>

<form method="POST">

<label>Food Name</label>

<input
type="text"
name="item_name"
class="form-control"
required>

<br>

<label>Category</label>

<input
type="text"
name="category"
class="form-control"
required>

<br>

<label>Price</label>

<input
type="number"
name="price"
class="form-control"
required>

<br>

<button class="btn btn-primary">
Add Item
</button>

</form>

</body>
</html>
