<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Tables</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>🪑 Restaurant Tables</h2>

<a href="/add_table" class="btn btn-success mb-3">
    Add Table
</a>

<table class="table table-bordered table-hover">

<tr>
    <th>ID</th>
    <th>Table Number</th>
    <th>Capacity</th>
    <th>Status</th>
    <th>Actions</th>
</tr>

{% for table in tables %}

<tr>

<td>{{ table.table_id }}</td>
<td>{{ table.table_number }}</td>
<td>{{ table.capacity }}</td>
<td>{{ table.status }}</td>

<td>

<a href="/edit_table/{{ table.table_id }}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_table/{{ table.table_id }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this table?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>
<hr>

<a href="/dashboard" class="btn btn-primary">
🏠 Back to Dashboard
</a>

</body>
</html>
