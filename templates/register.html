<!DOCTYPE html>
<html>

<head>

    <title>DineFlow Customer Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>🍽️ DineFlow</h3>
                    <h5>Customer Registration</h5>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <label>Customer Name</label>

                        <input
                            type="text"
                            name="customer_name"
                            class="form-control"
                            required>

                        <br>

                        <label>Phone Number</label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>

                        <br>

                        <label>Username</label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>

                        <br>

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                        <br>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <p>
                            Already have an account?
                        </p>

                        <a href="/" class="btn btn-secondary">
                            Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
