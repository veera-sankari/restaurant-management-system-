<!DOCTYPE html>

<html>

<head>

<title>Edit Customer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Edit Customer</h2>

<form method="POST">

<label>Name</label>

<input
type="text"
name="customer_name"
class="form-control"
value="{{ customer.customer_name }}"
required>

<br>

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ customer.phone }}"
required>

<br>

<button class="btn btn-primary">

Update Customer

</button>

</form>

</body>

</html>
