<!DOCTYPE html>
<html>
<head>
    <title>Menu Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>🍔 Restaurant Menu</h2>

<a href="/add_menu" class="btn btn-success mb-3">
    Add Food Item
</a>

<table class="table table-bordered table-hover">

<tr>
    <th>ID</th>
    <th>Food Name</th>
    <th>Category</th>
    <th>Price</th>
    <th>Status</th>
    <th>Actions</th>
</tr>

{% for item in menu %}

<tr>

<td>{{ item.menu_id }}</td>
<td>{{ item.item_name }}</td>
<td>{{ item.category }}</td>
<td>₹ {{ item.price }}</td>
<td>{{ item.availability }}</td>

<td>
    <a href="/edit_menu/{{ item.menu_id }}" class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="/delete_menu/{{ item.menu_id }}" class="btn btn-danger btn-sm"
       onclick="return confirm('Are you sure you want to delete this item?');">
        Delete
    </a>
</td>

</tr>

{% endfor %}

</table>
<hr>

<a href="/dashboard" class="btn btn-primary">
🏠 Back to Dashboard
</a>

</body>
</html>
